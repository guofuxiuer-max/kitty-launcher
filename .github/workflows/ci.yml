name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 语法检查
        run: python -m compileall -q kitty launcher.py
      - name: 引擎冒烟测试（不启 UI）
        run: python -c "from kitty import core; print('java:', [j['major'] for j in core.list_java()]); print('versions:', len(core.remote_versions()))"
      - name: 界面无头渲染（Linux 需 xvfb）
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0; fi
          QT_QPA_PLATFORM=offscreen python -m kitty.main --screenshot screenshots
