name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q kitty launcher.py

      - name: 引擎冒烟（不启 UI）
        run: |
          python -c "from kitty import core, paths; print('version', paths.VERSION); print('java:', [j['major'] for j in core.list_java()]); print('versions:', len(core.remote_versions()))"

      # GUI 渲染在 CI 上偶发失败，不阻塞结论
      - name: 界面无头渲染（非阻塞）
        continue-on-error: true
        run: QT_QPA_PLATFORM=offscreen python -m kitty.main --screenshot screenshots-ci
